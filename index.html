<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Eckert Haus Kitchen</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="The Eckert family recipe box">
<meta name="theme-color" content="#FFF8F3">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8F3; --bg-2:#FFF1E8; --surface:#FFFFFF; --surface-2:#FFFBF8;
  --peach:#FFB997; --peach-soft:#FFE6D8; --peach-deep:#E97E5A;
  --mint:#9ED9C3; --mint-soft:#E0F5EC; --mint-deep:#2F8A6C;
  --blush:#F7B7C5; --blush-soft:#FDE9EE; --blush-deep:#D9607D;
  --lav:#CFC6F2; --lav-soft:#EFEBFC; --lav-deep:#6D5BC4;
  --butter:#FBE3A6; --butter-soft:#FFF5DA;
  --ink:#2E2530; --ink-2:#6F6470; --ink-3:#A89DA7; --line:rgba(46,37,48,.08); --line-2:rgba(46,37,48,.14);
  --heart:#F07C97;
  --r-sm:12px; --r:18px; --r-lg:24px; --r-xl:30px;
  --shadow-sm:0 1px 2px rgba(80,40,30,.05),0 2px 8px rgba(80,40,30,.05);
  --shadow:0 2px 6px rgba(80,40,30,.05),0 12px 32px rgba(80,40,30,.08);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --font-round:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
html.lock{overflow:hidden}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:16px;height:16px}
svg.i.fill{fill:currentColor}
:focus-visible{outline:3px solid color-mix(in srgb,var(--peach) 70%,transparent);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- boot / auth ---------- */
.boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100}
.logo{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;font-size:36px;
  background:linear-gradient(145deg,var(--peach-soft),var(--mint-soft));box-shadow:var(--shadow)}
.boot .logo{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06)}}
.auth{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px calc(32px + var(--safe-b));
  background:radial-gradient(120% 60% at 0% 0%,var(--peach-soft) 0,transparent 60%),radial-gradient(120% 60% at 100% 100%,var(--mint-soft) 0,transparent 60%),var(--bg)}
.auth-card{max-width:400px;width:100%;margin:0 auto;text-align:center}
.auth h1{font:800 34px/1.1 var(--font-round);margin:22px 0 8px;letter-spacing:-.02em}
.auth p{color:var(--ink-2);margin:0 0 28px}
.auth .field{margin-bottom:12px}
.auth small{display:block;color:var(--ink-3);margin-top:14px;font-size:13px}

/* ---------- layout ---------- */
.app{max-width:1120px;margin:0 auto;padding:calc(var(--safe-t) + 8px) 16px calc(96px + var(--safe-b))}
.nav-top{display:flex;align-items:center;justify-content:space-between;height:44px}
.eyebrow{font:700 13px var(--font-round);text-transform:uppercase;letter-spacing:.08em;color:var(--peach-deep);display:flex;align-items:center;gap:6px}
.large-title{font:800 34px/1.1 var(--font-round);letter-spacing:-.025em;margin:2px 0 14px}
.circle-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow-sm);color:var(--ink)}
.circle-btn.primary{background:linear-gradient(145deg,#FFC7AB,var(--peach));color:#fff}
.circle-btn:active,.btn:active,.card:active,.chip:active{transform:scale(.96)}
.circle-btn,.btn,.card,.chip{transition:transform .2s var(--ease),background .2s,box-shadow .2s,color .2s}
.view{animation:fade .35s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}

/* ---------- search / toolbar ---------- */
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:14px;background:rgba(46,37,48,.055);color:var(--ink-3)}
.search input{flex:1;border:0;background:none;outline:none;color:var(--ink);font-size:17px;min-width:0}
.search input::placeholder{color:var(--ink-3)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.toolbar{display:flex;gap:10px;align-items:center;margin:12px 0 4px}
.toolbar .pill-btn{flex:none}
.pill-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow-sm);font-weight:600;font-size:15px}
.pill-btn .badge{min-width:20px;height:20px;border-radius:10px;background:var(--peach);color:#fff;font-size:12px;display:grid;place-items:center;padding:0 6px}
.pill-btn .chev{transition:transform .3s var(--ease)}
.pill-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.segmented{display:inline-flex;background:rgba(46,37,48,.06);border-radius:10px;padding:2px;position:relative;overflow-x:auto;scrollbar-width:none;max-width:100%}
.segmented::-webkit-scrollbar{display:none}
.segmented button{height:32px;padding:0 11px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.segmented button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08),0 3px 8px rgba(0,0,0,.05)}
.toolbar .segmented{margin-left:auto}

/* ---------- collapsible filters ---------- */
.collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.collapse.open{grid-template-rows:1fr}
.collapse>div{overflow:hidden}
.filter-panel{margin:10px 0 2px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:4px 0}
.fgroup{border-bottom:1px solid var(--line)}
.fgroup:last-of-type{border-bottom:0}
.fgroup summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 18px;cursor:pointer;font-weight:600}
.fgroup summary::-webkit-details-marker{display:none}
.fgroup summary .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.fgroup summary .count{margin-left:auto;color:var(--ink-3);font-weight:500;font-size:14px}
.fgroup summary .count.on{color:var(--peach-deep)}
.fgroup summary .chev{color:var(--ink-3);transition:transform .3s var(--ease)}
.fgroup[open] summary .chev{transform:rotate(180deg)}
.fgroup .chips{padding:0 18px 16px}
.filter-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 18px 12px;border-top:1px solid var(--line)}
.link-btn{color:var(--peach-deep);font-weight:600;font-size:15px;padding:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;background:var(--bg-2);font-size:14px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip small{font-weight:500;color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip[aria-pressed="true"] small{color:rgba(255,255,255,.6)}
.chip.static{height:28px;padding:0 11px;font-size:13px;cursor:default}
.chip.mint{background:var(--mint-soft);color:var(--mint-deep)}
.chip.peach{background:var(--peach-soft);color:#B8583A}
.chip.blush{background:var(--blush-soft);color:#B04766}
.chip.lav{background:var(--lav-soft);color:var(--lav-deep)}
.chip.butter{background:var(--butter-soft);color:#96701A}
.active-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 16px}
.active-row::-webkit-scrollbar{display:none}
.active-row .chip{background:var(--peach-soft);color:#B8583A;height:30px;font-size:13px}

/* ---------- sections, cards ---------- */
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:24px 2px 12px}
.section-head h2{font:800 22px var(--font-round);letter-spacing:-.02em;margin:0;display:flex;align-items:center;gap:8px}
.section-head span{color:var(--ink-3);font-size:14px;font-weight:500}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:min(74%,300px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .card{scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{display:block;text-align:left;width:100%;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden}
.card .thumb{position:relative;aspect-ratio:1/1;overflow:hidden}
.rail .card .thumb{aspect-ratio:16/11}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.art{width:100%;height:100%;display:grid;place-items:center;font-size:44px}
.card .pin-dot{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--peach-deep)}
.card .score{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:13px;
  background:rgba(255,255,255,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:13px;font-weight:700;color:var(--ink)}
.card .score svg{color:var(--heart);width:14px;height:14px}
.card .body{padding:11px 13px 13px}
.card h3{font-size:15.5px;line-height:1.25;font-weight:650;margin:0 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;padding:48px 20px;color:var(--ink-2)}
.empty .logo{margin:0 auto 16px}
.empty h3{font:800 20px var(--font-round);margin:0 0 6px;color:var(--ink)}
.empty p{margin:0 0 18px}

/* ---------- buttons & forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:15px;font-weight:650;font-size:17px;background:var(--surface);box-shadow:var(--shadow-sm)}
.btn.primary{background:linear-gradient(145deg,#FFC4A7,var(--peach) 55%,#FFA886);color:#fff;box-shadow:0 6px 18px rgba(233,126,90,.28);text-shadow:0 1px 1px rgba(160,70,40,.18)}
.btn.mint{background:var(--mint);color:#fff;box-shadow:0 6px 18px rgba(47,138,108,.2);text-shadow:0 1px 1px rgba(30,90,70,.2)}
.btn.soft{background:var(--peach-soft);color:#B8583A;box-shadow:none}
.btn.danger{background:var(--blush-soft);color:var(--blush-deep);box-shadow:none}
.btn.block{width:100%}
.btn.sm{height:38px;font-size:15px;padding:0 14px;border-radius:12px}
.btn[disabled]{opacity:.55;pointer-events:none}
.field{display:block;width:100%;height:52px;padding:0 16px;border-radius:15px;border:1px solid var(--line-2);background:var(--surface);font-size:17px;outline:none;transition:border .2s,box-shadow .2s}
.field:focus{border-color:var(--peach);box-shadow:0 0 0 4px color-mix(in srgb,var(--peach) 22%,transparent)}
.group-title{font-size:13px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;margin:26px 16px 8px}
.group{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 16px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--line)}
.row label{flex:none;width:96px;color:var(--ink);font-weight:500}
.row input,.row select,.row textarea{flex:1;min-width:0;border:0;outline:none;background:none;font-size:17px;padding:14px 0;text-align:left}
.row input::placeholder,.row textarea::placeholder{color:var(--ink-3)}
.row textarea{resize:none;line-height:1.45}
.row.stack{flex-direction:column;align-items:stretch;gap:0;padding-top:12px}
.row.stack label{width:auto;font-size:13px;color:var(--ink-3);font-weight:600}
.row.stack textarea,.row.stack input{padding:6px 0 14px}
.row .unit{color:var(--ink-3);font-size:15px}
.hint{font-size:13px;color:var(--ink-3);margin:8px 16px 0;line-height:1.45}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pair input{width:0}
.pair .row+.row::before{display:none}
.pair .row:nth-child(2){border-left:1px solid var(--line)}
.pair label{width:auto!important;font-size:15px}
.pair input{text-align:right!important}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:6px 8px calc(6px + var(--safe-b));
  background:rgba(255,248,243,.78);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border-top:1px solid var(--line)}
.tabbar .inner{display:flex;width:100%;max-width:520px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:11px;font-weight:600;color:var(--ink-3)}
.tabbar button svg{width:26px;height:26px}
.tabbar button[aria-current="page"]{color:var(--peach-deep)}
.tabbar button[aria-current="page"] svg{stroke-width:2.1}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(46,37,48,.28);opacity:0;pointer-events:none;transition:opacity .35s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);transform:translateY(102%);transition:transform .45s var(--ease);
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet.open{transform:none}
.sheet.editor{z-index:60}
@media(min-width:760px){
  .sheet{inset:28px max(24px,calc(50% - 390px)) 0;border-radius:30px 30px 0 0;box-shadow:0 -10px 60px rgba(46,37,48,.18)}
}
.sheet-bar{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:calc(56px + var(--safe-t));padding:var(--safe-t) 12px 0;
  background:rgba(255,248,243,.82);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--line)}
@media(min-width:760px){.sheet-bar{padding-top:0;height:56px}}
.sheet-bar h2{margin:0;font-size:17px;font-weight:650}
.sheet-bar .l{justify-self:start}.sheet-bar .r{justify-self:end}
.bar-btn{height:38px;padding:0 8px;font-size:17px;color:var(--peach-deep);font-weight:500}
.bar-btn.strong{font-weight:700}
.sheet-body{padding:8px 16px calc(40px + var(--safe-b));max-width:720px;margin:0 auto}

/* detail */
.hero{position:relative;height:min(52vh,380px);background:var(--peach-soft)}
.hero img,.hero .art{width:100%;height:100%;object-fit:cover;font-size:88px}
.hero-actions{position:absolute;top:calc(12px + var(--safe-t));left:14px;right:14px;display:flex;justify-content:space-between;gap:8px}
@media(min-width:760px){.hero{border-radius:30px 30px 0 0;overflow:hidden}.hero-actions{top:14px}}
.hero-actions .grp{display:flex;gap:8px}
.glass{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.72);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.glass.on{color:#fff;background:var(--peach-deep)}
.detail{position:relative;margin-top:-30px;background:var(--bg);border-radius:30px 30px 0 0;padding:26px 18px calc(48px + var(--safe-b))}
.detail-inner{max-width:680px;margin:0 auto}
.detail h1{font:800 29px/1.12 var(--font-round);letter-spacing:-.025em;margin:0 0 8px}
.detail .desc{color:var(--ink-2);margin:0 0 16px;font-size:16.5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.stat{background:var(--surface);border-radius:16px;padding:11px 6px;text-align:center;box-shadow:var(--shadow-sm)}
.stat b{display:block;font:800 18px var(--font-round);color:var(--ink)}
.stat span{font-size:11.5px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.panel{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:18px;margin-top:14px}
.panel h3{font:800 19px var(--font-round);margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;letter-spacing:-.015em}
.hearts{display:flex;gap:6px}
.hearts button{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--line-2);transition:transform .25s var(--ease),color .2s}
.hearts button svg{width:32px;height:32px}
.hearts button.on{color:var(--heart)}
.hearts button.pop{animation:pop .4s var(--ease)}
@keyframes pop{40%{transform:scale(1.3)}}
.mini-hearts{display:inline-flex;gap:1px;color:var(--heart);vertical-align:-2px}
.mini-hearts svg{width:14px;height:14px}
.mini-hearts .off{color:var(--line-2)}
.fam-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.fam-row:first-of-type{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.fam-row .who{font-size:13px;color:var(--ink-3)}
.fam-row .avg{margin-left:auto;font-weight:700;display:flex;align-items:center;gap:6px}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.ing li:first-child{border-top:0}
.ing .box{width:22px;height:22px;flex:none;border-radius:50%;border:1.8px solid var(--line-2);display:grid;place-items:center;color:#fff;margin-top:1px;transition:.2s}
.ing li.done .box{background:var(--mint);border-color:var(--mint)}
.ing li.done .txt{color:var(--ink-3);text-decoration:line-through}
.ing .q{font-weight:700}
.ing .note{color:var(--ink-3)}
.subhead{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mint-deep);margin:14px 0 4px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;counter-increment:s}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--peach-soft);color:#B8583A;font:800 15px var(--font-round)}
.steps li.done{color:var(--ink-3)}
.steps li.done::before{content:"✓";background:var(--mint-soft);color:var(--mint-deep)}
.action-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.action{white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow-sm);font-size:12.5px;font-weight:600;color:var(--ink-2);text-decoration:none}
.action svg{color:var(--peach-deep)}
.action.on{background:var(--peach-soft);color:#B8583A}

/* editor */
.import{background:linear-gradient(140deg,var(--mint-soft),#F1FAF6 60%,var(--peach-soft));border-radius:var(--r-lg);padding:16px;margin-top:10px}
.import h3{margin:0 0 4px;font:800 18px var(--font-round);display:flex;align-items:center;gap:8px;color:var(--mint-deep)}
.import p{margin:0 0 12px;font-size:14px;color:var(--ink-2)}
.import .line{display:flex;gap:8px}
.import .field{height:46px;font-size:16px;border-color:transparent;box-shadow:var(--shadow-sm)}
.photo{position:relative;margin-top:14px;height:190px;border-radius:var(--r-lg);overflow:hidden;background:repeating-linear-gradient(135deg,var(--bg-2) 0 12px,var(--surface-2) 12px 24px);
  display:grid;place-items:center;color:var(--ink-3);border:1.5px dashed var(--line-2);cursor:pointer}
.photo.has{border:0}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .ph{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600}
.photo .ph svg{width:30px;height:30px;color:var(--peach-deep)}
.photo .change{position:absolute;right:10px;bottom:10px}
.photo-links{display:flex;justify-content:space-between;margin:8px 4px 0}
.tag-input{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px;align-items:center}
.tag-input input{flex:1;min-width:120px;border:0;outline:none;background:none;font-size:16px;padding:6px 0}
.tag-input .chip{height:30px;font-size:13px;background:var(--lav-soft);color:var(--lav-deep)}
.suggest{display:flex;gap:6px;flex-wrap:wrap;margin:10px 4px 0}
.suggest .chip{height:28px;font-size:13px;background:transparent;border:1px dashed var(--line-2)}
.parsed{margin:10px 0 0;padding:0 16px 12px;list-style:none;font-size:14px}
.parsed li{display:flex;gap:8px;padding:5px 0;border-top:1px dashed var(--line)}
.parsed .q{min-width:74px;font-weight:700;color:#B8583A}
.parsed .sec{color:var(--mint-deep);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;border:0;padding-top:10px}
.parsed-toggle{display:flex;align-items:center;gap:6px;padding:0 16px 12px;font-size:14px;font-weight:600;color:var(--mint-deep)}
.seg-row{padding:10px 16px}
.seg-row .segmented{width:100%}
.seg-row .segmented button{flex:1}

/* rankings */
.rank{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-sm);margin-bottom:10px;width:100%;text-align:left}
.rank .no{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font:800 16px var(--font-round);color:var(--ink-3);background:var(--bg-2)}
.rank:nth-child(1) .no{background:linear-gradient(145deg,#FFD9C6,var(--peach));color:#fff}
.rank:nth-child(2) .no{background:linear-gradient(145deg,#D8F3E8,var(--mint));color:#fff}
.rank:nth-child(3) .no{background:linear-gradient(145deg,#FDDDE5,var(--blush));color:#fff}
.rank .tn{width:56px;height:56px;border-radius:14px;overflow:hidden;flex:none;font-size:26px}
.rank .tn img{width:100%;height:100%;object-fit:cover}
.rank .mid{flex:1;min-width:0}
.rank h4{margin:0 0 3px;font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .sub{font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:6px;white-space:nowrap}
.rank .big{flex:none}
@media(max-width:430px){.rank .avatars{display:none}}
.rank .big{font:800 20px var(--font-round);color:var(--ink);display:flex;align-items:center;gap:4px}
.rank .big svg{width:16px;height:16px;color:var(--heart)}
.avatars{display:flex}
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;border:2px solid var(--surface);margin-left:-6px}
.av:first-child{margin-left:0}

/* me */
.profile{display:flex;align-items:center;gap:14px;padding:18px;background:linear-gradient(140deg,var(--peach-soft),var(--blush-soft) 55%,var(--lav-soft));border-radius:var(--r-lg)}
.profile .big-av{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:#fff;font:800 26px var(--font-round);color:var(--peach-deep);box-shadow:var(--shadow-sm)}
.profile h2{margin:0;font:800 22px var(--font-round)}
.profile p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tile{background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow-sm)}
.tile b{display:block;font:800 26px var(--font-round)}
.tile span{font-size:13px;color:var(--ink-3);font-weight:600}
.swatches{display:flex;gap:10px;padding:12px 16px}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line-2)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.demo-note{margin-top:16px;padding:14px 16px;border-radius:var(--r);background:var(--butter-soft);color:#7A5A12;font-size:14px;line-height:1.5}

/* toast */
.toast{position:fixed;left:50%;width:max-content;text-align:center;bottom:calc(92px + var(--safe-b));transform:translate(-50%,20px);opacity:0;z-index:90;pointer-events:none;
  background:rgba(46,37,48,.92);color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;font-weight:500;max-width:calc(100% - 32px);box-shadow:var(--shadow);transition:.35s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(1turn)}}
.skeleton{background:linear-gradient(90deg,var(--bg-2),var(--surface) 50%,var(--bg-2));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v14H6.5A1.5 1.5 0 0 0 5 18.5z"/><path d="M5 18.5A1.5 1.5 0 0 0 6.5 20H19v-3"/></symbol>

<div id="boot" class="boot"><div class="logo">🍑</div></div>

<!-- ======================= SIGN IN ======================= -->
<section id="auth" class="auth" hidden>
  <div class="auth-card">
    <div class="logo" style="margin:0 auto">🍑</div>
    <h1>Eckert Haus<br>Kitchen</h1>
    <p id="authMsg">Our family recipe box. Sign in with your email — no password needed.</p>
    <form id="authForm">
      <label class="sr" for="authEmail">Email</label>
      <input class="field" id="authEmail" type="email" autocomplete="email" inputmode="email" placeholder="you@email.com" required>
      <button class="btn primary block" id="authBtn" type="submit">Send sign-in link</button>
    </form>
    <form id="codeForm" hidden>
      <label class="sr" for="authCode">Code</label>
      <input class="field" id="authCode" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code" maxlength="8" style="text-align:center;letter-spacing:.3em;font-weight:700">
      <button class="btn mint block" type="submit">Sign in with code</button>
      <button class="link-btn" type="button" id="codeBack" style="margin-top:10px">Use a different email</button>
    </form>
    <small>Using the Home Screen app? Type the 6-digit code from the email here.</small>
  </div>
</section>

<!-- ======================= APP ======================= -->
<div id="app" hidden>
  <main class="app">
    <!-- Recipes -->
    <section class="view" id="view-recipes" data-view="recipes">
      <div class="nav-top"><span class="eyebrow">🍑 Eckert Haus</span>
        <button class="circle-btn primary" data-act="new" aria-label="Add recipe"><svg class="i"><use href="#i-plus"/></svg></button></div>
      <h1 class="large-title">Recipes</h1>
      <label class="search"><svg class="i sm"><use href="#i-search"/></svg>
        <input id="q" type="search" placeholder="Search recipes, ingredients, tags" autocomplete="off" enterkeyhint="search"></label>
      <div class="toolbar">
        <button class="pill-btn" id="filterToggle" aria-expanded="false" aria-controls="filterPanel">
          <svg class="i sm"><use href="#i-sliders"/></svg>Filters<span class="badge" id="filterCount" hidden></span>
          <svg class="i sm chev"><use href="#i-down"/></svg></button>
        <div class="segmented" id="sort" role="group" aria-label="Sort">
          <button data-sort="new" aria-pressed="true">New</button><button data-sort="top">Top</button><button data-sort="quick">Quick</button><button data-sort="az">A–Z</button>
        </div>
      </div>
      <div class="collapse" id="filterWrap"><div><div class="filter-panel" id="filterPanel"></div></div></div>
      <div class="active-row" id="activeChips"></div>
      <div id="pinnedBlock"></div>
      <div class="section-head"><h2 id="allTitle">All recipes</h2><span id="allCount"></span></div>
      <div class="grid" id="grid"></div>
    </section>

    <!-- Pinned -->
    <section class="view" id="view-pinned" data-view="pinned" hidden>
      <div class="nav-top"><span class="eyebrow">📌 Quick access</span>
        <button class="circle-btn primary" data-act="new" aria-label="Add recipe"><svg class="i"><use href="#i-plus"/></svg></button></div>
      <h1 class="large-title">Pinned</h1>
      <div class="grid" id="pinnedGrid"></div>
    </section>

    <!-- Favorites / rankings -->
    <section class="view" id="view-favorites" data-view="favorites" hidden>
      <div class="nav-top"><span class="eyebrow">💗 Family rankings</span></div>
      <h1 class="large-title">Favorites</h1>
      <div class="segmented" id="famSeg" role="group" aria-label="Family" style="margin-bottom:16px"></div>
      <div id="rankList"></div>
    </section>

    <!-- Me -->
    <section class="view" id="view-me" data-view="me" hidden>
      <div class="nav-top"><span class="eyebrow">⚙︎ Settings</span></div>
      <h1 class="large-title">Me</h1>
      <div id="meBody"></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Main"><div class="inner">
    <button data-tab="recipes"><svg class="i"><use href="#i-book"/></svg>Recipes</button>
    <button data-tab="pinned"><svg class="i"><use href="#i-pin"/></svg>Pinned</button>
    <button data-tab="favorites"><svg class="i"><use href="#i-heart"/></svg>Favorites</button>
    <button data-tab="me"><svg class="i"><use href="#i-person"/></svg>Me</button>
  </div></nav>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="detailSheet" role="dialog" aria-modal="true" aria-label="Recipe"></div>
<div class="sheet editor" id="editorSheet" role="dialog" aria-modal="true" aria-label="Edit recipe"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="photoInput" accept="image/*" hidden>

<script type="module" src="js/app.js"></script>
</body>
</html>
